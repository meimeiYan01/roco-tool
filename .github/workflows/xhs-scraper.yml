name: XHS Merchant Scraper

on:
  schedule:
    - cron: '5 0,4,8,12 * * *'  # UTC, 对应北京时间 08:05/12:05/16:05/20:05
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Restore browser cookies from secret
        env:
          XHS_COOKIES: ${{ secrets.XHS_COOKIES }}
        run: |
          if [ -n "$XHS_COOKIES" ]; then
            echo "$XHS_COOKIES" | base64 -d > /tmp/cookies.zip
            mkdir -p scripts/.xhs_browser_data/Default/Network
            unzip -o /tmp/cookies.zip -d scripts/.xhs_browser_data/
            echo "[✓] Cookies restored"
          else
            echo "[!] XHS_COOKIES secret not set, skipping"
          fi

      - name: Run scraper (headless)
        run: python scripts/xhs_merchant_scraper.py --headless
        timeout-minutes: 5

      - name: Copy result to public/
        run: |
          if [ -f scripts/xhs_latest_note.json ]; then
            cp scripts/xhs_latest_note.json public/xhs_latest_note.json
            echo "[✓] Copied to public/"
          else
            echo "[!] No output file found"
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/xhs_latest_note.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update merchant data from XHS scraper [$(date -u +%Y-%m-%d)]"
            git push
            echo "[✓] Changes pushed"
          fi
