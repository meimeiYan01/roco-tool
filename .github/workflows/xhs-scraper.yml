name: XHS Merchant Scraper

on:
  schedule:
    - cron: '5 0,4,8,12 * * *'  # UTC, 对应北京时间 08:05/12:05/16:05/20:05
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Restore browser cookies from secret
        env:
          XHS_COOKIES: ${{ secrets.XHS_COOKIES }}
        run: |
          if [ -n "$XHS_COOKIES" ]; then
            echo "$XHS_COOKIES" | base64 -d > /tmp/cookies.zip
            # 解压到 scripts/.xhs_browser_data/，保持 Default/Network/ 结构
            mkdir -p scripts/.xhs_browser_data
            unzip -o /tmp/cookies.zip -d scripts/.xhs_browser_data/
            # 验证 cookies 文件存在
            if [ -f scripts/.xhs_browser_data/Default/Network/Cookies ]; then
              echo "[✓] Cookies restored successfully"
            else
              echo "[!] Cookies file not found after extraction"
              find scripts/.xhs_browser_data -name "Cookies" 2>/dev/null
            fi
          else
            echo "[!] XHS_COOKIES secret not set, skipping"
          fi

      - name: Run scraper (headless)
        run: python scripts/xhs_merchant_scraper.py --headless
        timeout-minutes: 5
        continue-on-error: true

      - name: Check scraper output
        id: check-output
        run: |
          if [ -f scripts/xhs_latest_note.json ]; then
            echo "has_output=true" >> $GITHUB_OUTPUT
            echo "[✓] Scraper produced output"
            cat scripts/xhs_latest_note.json | head -5
          else
            echo "has_output=false" >> $GITHUB_OUTPUT
            echo "[!] No output file found"
          fi

      - name: Copy result to public/
        if: steps.check-output.outputs.has_output == 'true'
        run: cp scripts/xhs_latest_note.json public/xhs_latest_note.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/xhs_latest_note.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update merchant data from XHS scraper [$(date -u +%Y-%m-%d)]"
            git push
            echo "[✓] Changes pushed"
          fi
